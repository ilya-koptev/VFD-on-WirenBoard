; Bring-up прошивки MN12832L на NUCLEO-F411RE (HAL).
; Задача этой платы — оживить стекло и разгадать тайминги; боевой код потом
; переносится ~1:1 в GD32E230-мезонин (SPI+DMA+таймер — та же парадигма).

[env:nucleo_f411re]
platform  = ststm32
board     = nucleo_f411re
framework = stm32cube

; Заливать будем проверенным путём — STM32CubeProgrammer по SWD (under reset).
; PlatformIO-upload через OpenOCD оставляем на потом (ST-Link FW J37).
upload_protocol = stlink

monitor_speed = 115200

; Приложение живёт со смещением 16 КБ: в начале флеша сидит загрузчик из fw-vfd.
; Таблицу векторов сдвигаем в main через SCB->VTOR, чтобы не зависеть от версии
; system_stm32f4xx.c в пакете.
board_build.ldscript = ldscript_app.ld

build_flags =
    -Wall
    -Os                        ; оптимизация по размеру
    -ffunction-sections        ; каждая функция в свою секцию...
    -fdata-sections            ; ...и каждая переменная тоже
    -Wl,--gc-sections          ; ...чтобы линкер выбросил неиспользуемое
    -specs=nano.specs          ; компактная libc вместо полной
