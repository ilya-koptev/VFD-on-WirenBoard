; Оригинальный драйвер IlkerGuness MN12832L на настоящем ESP32 (WROOM-32).
; Цель: проверить дисплей/протокол заведомо рабочим кодом на его родной платформе.
; Разводка ESP32->плата: GPIO23=SIN, GPIO18=CLK, GPIO22=LAT, GPIO21=BLK, GND, EF->+3.3В (вручную!).
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
upload_port  = COM5
monitor_port = COM5
monitor_speed = 115200
